# Replaces the image's default server. Serves the built SPA and proxies the API host (docker compose service "api").
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Static files. The API sets its own security headers, so these live here and not on the proxied locations.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # The Vite build has no inline script or style and loads nothing cross-origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # index.html and client-side routes: always revalidate so a new deploy is picked up.
        expires -1;
        try_files $uri $uri/ /index.html;

        # Vite emits content-hashed file names under /assets, so they can be cached for good.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
    }

    location ~ ^/(api/|openapi/|swagger|health$|alive$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # $http_host keeps the client's port ($host drops it), so the OpenAPI servers URL points back at :8080.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}

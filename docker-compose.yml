# Full stack for reviewers: `cp .env.example .env` (then edit the values), `docker compose up --build`,
# open http://localhost:8080. Secrets come only from .env; a missing required value stops compose with its message.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container's own environment.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # nginx in front sets X-Forwarded-For/Proto; this makes ASP.NET Core honour them (client IP for rate limiting).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__appdb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (at least 32 bytes, see .env.example)}
      Seed__Enabled: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
      Logging__Console__FormatterName: json
    healthcheck:
      # The aspnet image has no curl/wget. bash's /dev/tcp sends a raw HTTP request to /health (readiness, includes
      # the database) and passes only on a 200 status line, so no extra tool is installed into the image.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:

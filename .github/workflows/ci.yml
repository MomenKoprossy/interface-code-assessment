name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # backend/global.json selects the SDK and the Microsoft.Testing.Platform runner; dotnet reads it from the cwd.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore EmployeePayroll.slnx
      - run: dotnet build EmployeePayroll.slnx -c Release --no-restore
      # Integration tests start PostgreSQL with Testcontainers; Docker is preinstalled on ubuntu runners.
      - run: dotnet test EmployeePayroll.slnx -c Release --no-build
      - run: dotnet test src/BuildingBlocks/BuildingBlocks.slnx -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The images are built, never run, so compose just needs every required variable set: fill the secrets that
      # .env.example leaves empty (JWT_KEY always) with throwaway random values.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i             -e "s|^JWT_KEY=$|JWT_KEY=$(openssl rand -base64 48)|"             -e "s|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=$(openssl rand -hex 16)|"             -e "s|^DEMO_PASSWORD=$|DEMO_PASSWORD=$(openssl rand -hex 16)|"             .env
      - run: docker compose config --quiet
      - run: docker compose build

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        # backend/global.json selects the SDK and the Microsoft.Testing.Platform runner; dotnet reads it from the cwd.
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: dotnet restore EmployeePayroll.slnx
      - run: dotnet build EmployeePayroll.slnx -c Release --no-restore
      # Integration tests start PostgreSQL with Testcontainers; Docker is preinstalled on ubuntu runners.
      - run: dotnet test EmployeePayroll.slnx -c Release --no-build
      - run: dotnet test src/BuildingBlocks/BuildingBlocks.slnx -c Release

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Fill JWT_KEY, which .env.example leaves empty, with a throwaway random value.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_KEY=$|JWT_KEY=$(openssl rand -base64 48)|" .env
      - run: docker compose config --quiet
      - run: docker compose build
      # Smoke test through nginx: --wait blocks until the health checks pass.
      - run: docker compose up -d --wait
      - run: curl -fsS http://127.0.0.1:8080/health
      - run: curl -fsS http://127.0.0.1:8080/openapi/v1.json | jq -e '.servers[0].url | contains(":8080")'
      - if: always()
        run: docker compose down -v
